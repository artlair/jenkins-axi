name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Pure Python, stdlib-only: no platform pin needed, runs on any runner.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Formatting (black --check)
        run: uv run black --check .

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Tests (pytest)
        run: uv run pytest
